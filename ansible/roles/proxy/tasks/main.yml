---
- name: Launch proxy
  docker_container:
    name: "{{ proxy_container }}"
    image: "{{ proxy_image }}"
    state: started
    pull: true
    restart_policy: always
    networks:
      - name: "{{ app_network }}"
    ports:
      - "80:80"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
